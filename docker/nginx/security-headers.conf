# Included from every `location` block in default.conf.
#
# Why a separate file: nginx's `add_header` is not additive across levels. As soon
# as one `location` declares its own `add_header`, it stops inheriting the ones
# declared at `server` level. Including this snippet in each location keeps the
# headers present everywhere instead of silently disappearing on the locations
# that set Cache-Control.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

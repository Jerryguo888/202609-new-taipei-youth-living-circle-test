# Shared proxy settings for the AI chat backend, included by the /api/
# locations in default.conf so the health probe and the chat endpoint cannot
# drift apart.
#
# Docker's embedded DNS is used through a variable on purpose: with a literal
# `proxy_pass http://chat:8000`, nginx resolves the name once at config load
# and refuses to START if the chat container is not up yet. Resolving per
# request means a missing backend degrades to 502 instead of taking the whole
# site down. Using a variable also drops the implicit URI pass-through, hence
# the explicit $request_uri.
resolver 127.0.0.11 valid=10s ipv6=off;
set $chat_upstream chat;
proxy_pass http://$chat_upstream:8000$request_uri;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Server-Sent Events: buffering would hold the whole answer back and defeat
# token-by-token streaming. Connection must be cleared so the upstream does not
# see a keep-alive hop header.
proxy_set_header Connection "";
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding on;

# 逾時鏈由內而外遞增，讓最內層先報錯，錯誤訊息才指得出真正的原因：
#   boto3 read_timeout 60s  <  nginx 120s  <  前端 150s
# 反過來的話（例如前端比 nginx 短）瀏覽器會先放棄，畫面上只剩一句「服務暫時
# 無法使用」，而後端其實正要回一個講得清楚的 Bedrock 錯誤。
proxy_connect_timeout 5s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# The backend already sends Cache-Control: no-cache. Hide it and set a single
# stronger value, otherwise responses carry two competing Cache-Control values.
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;

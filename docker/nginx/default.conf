# Static hosting for the built Vue 3 + Vite SPA (repo-root `dist/`), plus a
# reverse proxy to the AI chat backend.
#
# Port 8080 (not 80) because the runtime image is nginxinc/nginx-unprivileged:
# nginx runs as a non-root user and cannot bind privileged ports. The host-side
# port is chosen in compose.yml via ${WEB_PORT}.

# Rate limit for the chat API. This endpoint is unauthenticated and every call
# costs real money on Bedrock, so cap it per client IP. Files under conf.d are
# included inside the `http` block, which is where limit_req_zone belongs.
# Note this keys on the direct client IP; behind a further proxy or CDN it
# would need X-Forwarded-For handling via real_ip_module to stay meaningful.
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=30r/m;
limit_req_status 429;

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The CSV data files and the UI copy are UTF-8 (Traditional Chinese).
    charset       utf-8;
    charset_types text/css text/plain text/csv text/javascript application/javascript application/json image/svg+xml;

    # Some data files use Chinese filenames (e.g. 新北市行政區.csv); the browser
    # percent-encodes them and nginx decodes back to UTF-8 bytes on disk.
    # No Content-Security-Policy is set on purpose: the app pulls CARTO basemap
    # tiles and MapLibre workers at runtime, and a wrong CSP silently breaks the
    # map. Add one deliberately once the exact tile/style origins are pinned.

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/csv
        text/javascript
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    # Container-local liveness probe used by HEALTHCHECK and the deploy workflow.
    # Deliberately served by nginx itself so the static site's health never
    # depends on the chat backend or on AWS being reachable.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- AI chat backend (Bedrock + S3 knowledge base) --------------------
    # Same-origin proxy, so the browser needs no CORS and no second exposed
    # port, and the backend container stays unpublished.

    # Health probe is intentionally NOT rate limited: it is cheap, never calls
    # AWS, and is used by the deploy smoke test, so throttling it would only
    # create false deploy failures.
    location = /api/health {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-chat.conf;
        access_log off;
    }

    # Everything else under /api/ reaches the model and therefore costs money.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=chat_api burst=10 nodelay;
        include /etc/nginx/snippets/proxy-chat.conf;
    }

    # Vite bundles land in /assets/ alongside the unhashed public/assets/ image,
    # so cache for 30 days instead of `immutable` — a hashed filename would be
    # safe forever, but the hero PNG keeps its name across rebuilds.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Cache-Control is set only via add_header. Using `expires` as well would
        # emit a second, competing Cache-Control header on every response.
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # CSV datasets: cache briefly but always revalidate, so refreshed data goes
    # live without waiting out a long TTL.
    location /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Scoped types override: everything served here is CSV. A `types` block
        # replaces the inherited MIME map for this location only, which is fine
        # because /data/ contains nothing else.
        types { text/csv csv; }
        default_type text/csv;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # The HTML shell must never be cached, otherwise clients keep loading the
    # previous deploy's asset references after a rollout.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hash-based router (createWebHashHistory) means deep links never hit the
    # server as real paths, but the fallback keeps direct URLs working anyway.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

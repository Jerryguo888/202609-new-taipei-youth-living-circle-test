name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  # Never abort a rollout midway: a half-applied deploy is worse than a queued one.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: /home/ubuntu/202609-new-taipei-youth-living-circle-test

jobs:
  deploy:
    runs-on: [self-hosted, main]
    timeout-minutes: 30
    env:
      # Vite inlines VITE_* vars at build time, so the key has to be present for
      # `compose build`. Without it the CARTO basemap silently falls back to the
      # free, watermarked tier.
      VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
      # AI chat backend config. None of these are credentials: the container
      # gets AWS access from the EC2 instance's IAM role. Repo *variables*
      # rather than secrets, so they stay visible and reviewable.
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
      # Defaults to the knowledge base already working in AWS-s3-KB-Test, so a
      # fresh deploy retrieves without needing extra repo setup. Override with a
      # KNOWLEDGE_BASE_ID repo variable to point at a different one.
      KNOWLEDGE_BASE_ID: ${{ vars.KNOWLEDGE_BASE_ID || '4HYLRWIZGS' }}
      KB_SEARCH_MODE: ${{ vars.KB_SEARCH_MODE || 'managed' }}
      KB_NUM_RESULTS: ${{ vars.KB_NUM_RESULTS || '5' }}
      MAX_TOKENS: ${{ vars.MAX_TOKENS || '2048' }}
      # Tool use: lets the assistant pick its own data sources.
      ENABLE_TOOLS: ${{ vars.ENABLE_TOOLS || 'true' }}
      MAX_TOOL_ROUNDS: ${{ vars.MAX_TOOL_ROUNDS || '4' }}
      # local  = read the metrics snapshot baked into the image (no AWS needed)
      # athena = query the S3 curated layer; falls back to the snapshot on failure
      METRIC_BACKEND: ${{ vars.METRIC_BACKEND || 'local' }}
      ATHENA_DATABASE: ${{ vars.ATHENA_DATABASE || 'ntpc_youth' }}
      ATHENA_WORKGROUP: ${{ vars.ATHENA_WORKGROUP || 'primary' }}
      # Required by Athena; a query is rejected outright without a result location.
      ATHENA_OUTPUT_LOCATION: ${{ vars.ATHENA_OUTPUT_LOCATION }}
      ATHENA_TIMEOUT_SECONDS: ${{ vars.ATHENA_TIMEOUT_SECONDS || '20' }}

    steps:
      - name: Warn on missing CARTO key
        # Checked through env because the secrets context is not usable in `if`.
        if: ${{ env.VITE_CARTO_KEY == '' }}
        run: echo "::warning::VITE_CARTO_KEY is not set; the CARTO basemap will use the free/watermarked tier."

      - name: Report and validate AI assistant config
        run: |
          set -euo pipefail
          echo "Region:         ${AWS_REGION}"
          echo "Model:          ${BEDROCK_MODEL_ID}"
          echo "Knowledge base: ${KNOWLEDGE_BASE_ID:-<none, answering without retrieval>}"
          echo "Search mode:    ${KB_SEARCH_MODE}"
          echo "Tool use:       ${ENABLE_TOOLS} (max ${MAX_TOOL_ROUNDS} rounds)"
          echo "Metric backend: ${METRIC_BACKEND}"

          if [ "${METRIC_BACKEND}" = "athena" ]; then
            echo "Athena database:  ${ATHENA_DATABASE}"
            echo "Athena workgroup: ${ATHENA_WORKGROUP}"
            echo "Athena output:    ${ATHENA_OUTPUT_LOCATION:-<unset>}"
            # Fail now rather than deploy something that silently serves cached
            # snapshot numbers while claiming to be backed by Athena.
            if [ -z "${ATHENA_OUTPUT_LOCATION}" ]; then
              echo "::error::METRIC_BACKEND is athena but ATHENA_OUTPUT_LOCATION is not set. Athena rejects queries without a result location, so every metric query would fall back to the snapshot. Set an ATHENA_OUTPUT_LOCATION repo variable (e.g. s3://your-bucket/athena-results/)."
              exit 1
            fi
            case "${ATHENA_OUTPUT_LOCATION}" in
              s3://*) ;;
              *) echo "::error::ATHENA_OUTPUT_LOCATION must be an s3:// URI, got '${ATHENA_OUTPUT_LOCATION}'."; exit 1 ;;
            esac
          fi

      - name: Pull
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git pull --ff-only
          echo "Deploying $(git rev-parse --short HEAD)"

      - name: Compose up
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # --pull keeps the node/nginx base images from going stale over time.
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Wait for containers to become healthy
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Both services define a HEALTHCHECK. The chat probe deliberately does
          # not call AWS, so it reflects the service being up rather than
          # Bedrock being reachable.
          for service in web chat; do
            cid="$(docker compose ps -q "$service")"
            if [ -z "$cid" ]; then
              echo "::error::No container found for the ${service} service."
              docker compose ps
              exit 1
            fi
            healthy=""
            for attempt in $(seq 1 30); do
              state="$(docker inspect -f '{{.State.Status}}' "$cid")"
              health="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
              echo "${service} attempt ${attempt}: state=${state} health=${health}"
              if [ "$health" = "healthy" ]; then
                healthy="yes"
                break
              fi
              if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "::error::${service} did not become healthy."
              docker compose logs --tail 100 "$service"
              exit 1
            fi
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Ask compose for the real published port instead of hardcoding it, so
          # this stays correct if the port mapping in compose.yml changes.
          addr="$(docker compose port web 8080)"
          port="${addr##*:}"
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:${port}/healthz" >/dev/null
          # Proves the built bundle is actually in the image, not just that nginx runs.
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:${port}/" | grep -q '<div id="app">'
          # Proves the nginx -> chat proxy hop works end to end. This does not
          # call Bedrock, so it stays green even if AWS access is misconfigured.
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:${port}/api/health" | grep -q '"status":"ok"'
          # The data catalogue and metric endpoints back both the charts and the
          # assistant's query_metrics tool, so a break here breaks the numbers
          # everywhere. Neither call touches AWS when METRIC_BACKEND=local.
          curl --fail --silent --show-error --max-time 15 \
            "http://127.0.0.1:${port}/api/meta/datasets" | grep -q '"metrics"'
          curl --fail --silent --show-error --max-time 15 \
            "http://127.0.0.1:${port}/api/metrics/youth_population?limit=1" | grep -q '"rows"'
          echo "Smoke test passed on port ${port} (static site + /api proxy + metrics)."

      - name: Check the metric backend is actually the configured one
        # Only meaningful for athena: the backend deliberately falls back to the
        # snapshot when Athena is unreachable, so a misconfigured deploy still
        # answers — with stale numbers and no visible complaint. Surface that.
        if: ${{ env.METRIC_BACKEND == 'athena' }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          addr="$(docker compose port web 8080)"
          port="${addr##*:}"
          body="$(curl --fail --silent --show-error --max-time 30 \
            "http://127.0.0.1:${port}/api/metrics/youth_population?limit=1")"
          echo "$body"
          if printf '%s' "$body" | grep -q '"source":"athena"'; then
            echo "Athena is serving metric queries."
          else
            echo "::warning::METRIC_BACKEND is athena but the query was answered by the local snapshot, so Athena is unreachable or misconfigured. Numbers will be from the snapshot baked into the image. Check the instance role has athena/glue/s3 permissions, that the Glue database '${ATHENA_DATABASE}' and its tables exist, and see the 'notes' field above for the underlying error."
          fi

      - name: Check the container can obtain AWS credentials
        # Warning, not a failure: the site and the map work regardless, and the
        # chat falls back to local canned replies. But this is the single most
        # common EC2 breakage, so surface it loudly rather than waiting for a
        # user to hit "Unable to locate credentials" in the chat window.
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Kept on one line: unindented lines inside a YAML block scalar would
          # terminate the block and break the workflow file.
          probe='import boto3,sys; c=boto3.Session().get_credentials(); sys.exit(1) if c is None else print("credential source:", getattr(c,"method","unknown"))'
          if docker compose exec -T chat python -c "$probe"; then
            echo "Container resolved AWS credentials."
          else
            echo "::warning::The chat container could not resolve AWS credentials, so Bedrock calls will fail and the assistant will use local fallback replies. On EC2 this is usually the IMDS hop limit: a limit of 1 blocks IMDSv2 from inside a container. Fix with: aws ec2 modify-instance-metadata-options --instance-id <id> --http-put-response-hop-limit 2 --http-tokens required"
          fi

      - name: Prune dangling images
        if: always()
        run: |
          set -euo pipefail
          # `compose build` retags :local each run, so the previous build is left
          # dangling. Without this the server's disk fills up over time.
          docker image prune --force

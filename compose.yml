# Deployment unit for the New Taipei youth living circle site.
#
#   web      nginx，靜態 SPA ＋ /api/ 反向代理，唯一對外的 port
#   chat     AI 助理後端（Bedrock ＋ S3 知識庫），不對外開 port
#   refresh  一次性資料更新容器，有 profile 所以不會被 up 啟動
#
# Local:  cp .env.example .env && docker compose up -d --build
# Server: driven by .github/workflows/deploy.yml on the self-hosted runner.
# 資料更新：docker compose run --rm refresh（每月由 refresh-data.yml 排程）
name: nt-youth-living-circle

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the environment (or .env); empty means the CARTO basemap
        # falls back to the free, watermarked tier.
        VITE_CARTO_KEY: ${VITE_CARTO_KEY:-}
    # IMAGE_TAG is set to the commit SHA by CI so each deploy is identifiable
    # and rollback is just re-running with an older tag.
    image: ${IMAGE_NAME:-nt-youth-living-circle}:${IMAGE_TAG:-local}
    container_name: nt-youth-living-circle-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # 每月／每小時更新寫進來的資料，掛成唯讀讓 nginx 直接當靜態檔服務
      # （/live/ 位置，見 docker/nginx/default.conf）。
      #
      # 為什麼不讓前端改打 /api/records：那條路每次都要經過 FastAPI 與
      # records 的驗證層，而且 MAX_LIMIT=50 —— YouBike 有 1606 站、托育 391 筆，
      # 面板要算全域統計，分頁拿會變成幾十次請求。這裡要的就是「整份檔案」，
      # 讓 nginx 服務靜態 JSON 是最直接也最便宜的做法。
      #
      # :ro 很重要：web 容器只需要讀。少了它，一個 nginx 的漏洞就能改寫
      # AI 引用的資料。
      - living-circle-data:/srv/live:ro
    logging:
      driver: json-file
      options:
        # Without this, json-file logs grow unbounded and eventually fill the
        # server's disk.
        max-size: "10m"
        max-file: "3"
    depends_on:
      # nginx proxies /api/ to the chat service. Only ordering is guaranteed
      # here, not readiness — nginx resolves the upstream lazily per request,
      # so a slow-starting backend just yields a 502 on early calls instead of
      # preventing the static site from coming up.
      - chat

  # AI 助理後端：Bedrock + S3 知識庫。沒有 published port，只能透過 web
  # 容器的 /api/ 反向代理進來，所以不會多開一個對外的攻擊面。
  chat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-nt-youth-living-circle}-chat:${IMAGE_TAG:-local}
    container_name: nt-youth-living-circle-chat
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # 憑證走 EC2 IAM Role，boto3 自己透過 IMDS 取得。這裡不要放 access key。
      AWS_REGION: ${AWS_REGION:-us-west-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      MAX_TOKENS: ${MAX_TOKENS:-2048}
      # 留空就只用模型回答，不接知識庫。
      KNOWLEDGE_BASE_ID: ${KNOWLEDGE_BASE_ID:-}
      KB_NUM_RESULTS: ${KB_NUM_RESULTS:-5}
      KB_SEARCH_MODE: ${KB_SEARCH_MODE:-managed}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      # 讓模型自己選要讀哪些資料
      ENABLE_TOOLS: ${ENABLE_TOOLS:-true}
      MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-4}
      # local = 讀烘進 image 的指標快照；athena = 查 S3 curated 層
      METRIC_BACKEND: ${METRIC_BACKEND:-local}
      ATHENA_DATABASE: ${ATHENA_DATABASE:-ntpc_youth}
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-primary}
      ATHENA_OUTPUT_LOCATION: ${ATHENA_OUTPUT_LOCATION:-}
      ATHENA_TIMEOUT_SECONDS: ${ATHENA_TIMEOUT_SECONDS:-20}
      # S3 資料湖：Athena 查的就是這裡。留空則整個資料湖功能停用（後台的手動
      # 更新仍然照常寫本機 volume），所以沒設定不會壞掉。
      # 注意這跟 KB_BUCKET 是兩個不同的 bucket，見 backend/data_sources.yaml 的說明。
      S3_DATA_BUCKET: ${S3_DATA_BUCKET:-}
      S3_CURATED_PREFIX: ${S3_CURATED_PREFIX:-curated/}
      LAKE_SYNC_ON_REFRESH: ${LAKE_SYNC_ON_REFRESH:-true}
      # 名冊優先讀這裡（每月更新寫入的 volume）；找不到才退回 image 內建版本
      RECORDS_DIR: /data/records
      # ---- 後台（帳號、知識庫檔案上傳、手動更新）----
      # 帳號檔位置。第一個管理員用 scripts/create_admin.py 建立，見 backend/README.md。
      ADMIN_USERS_PATH: /data/admin/users.json
      # 純 HTTP 下必須是 false，否則 cookie 送不出去。有 HTTPS 後請改成 true。
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-480}
      # 知識庫檔案上傳的目的地（跟資料湖是不同的 bucket）
      KB_BUCKET: ${KB_BUCKET:-}
      KB_PREFIX: ${KB_PREFIX:-kb/docs/}
      KB_DATA_SOURCE_ID: ${KB_DATA_SOURCE_ID:-}
      KB_MAX_UPLOAD_MB: ${KB_MAX_UPLOAD_MB:-20}
      FETCH_MAX_SHRINK: ${FETCH_MAX_SHRINK:-0.5}
    volumes:
      # 後台要寫帳號檔、手動更新要寫名冊，所以這裡必須可寫。
      # （先前是 read-only，加上後台功能後不得不放開；純讀取的服務仍然只讀。）
      - living-circle-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 資料更新用的一次性容器，不會被 `docker compose up` 啟動（有 profile）。
  # 執行：docker compose run --rm refresh
  #   REFRESH_GROUP=monthly  名冊類（托育、疫苗院所、接種時段）
  #   REFRESH_GROUP=hourly   YouBike 可借車數
  #   不設              全抓（後台「立即更新」按鈕與人工執行）
  #
  # 由兩個排程觸發：
  #   .github/workflows/refresh-data.yml     每月 1 號 -> monthly
  #   .github/workflows/refresh-youbike.yml  每小時    -> hourly
  #
  # 用同一個服務加參數而不是開兩個服務：兩者的環境變數、volume、關卡邏輯完全
  # 相同，複製一份只會在改動時漏掉一邊。
  refresh:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-nt-youth-living-circle}-chat:${IMAGE_TAG:-local}
    environment:
      RECORDS_DIR: /data/records
      # 抓到 0 筆、或筆數掉超過一半時保留舊檔不覆蓋，
      # 避免上游出問題時把名冊清空
      FETCH_MAX_SHRINK: ${FETCH_MAX_SHRINK:-0.5}
      # 抓完直接推上 S3，讓 Athena 看到的跟本機檔案是同一批。分兩次做的話，
      # 中間那段時間 Athena 查到的是上個月的數字，而畫面上不會有任何提示。
      AWS_REGION: ${AWS_REGION:-us-west-2}
      S3_DATA_BUCKET: ${S3_DATA_BUCKET:-}
      S3_CURATED_PREFIX: ${S3_CURATED_PREFIX:-curated/}
      LAKE_SYNC_ON_REFRESH: ${LAKE_SYNC_ON_REFRESH:-true}
      REFRESH_GROUP: ${REFRESH_GROUP:-}
    volumes:
      - living-circle-data:/data
    # 需要寫入，所以不能沿用 chat 的 read-only 掛載
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/records
        # 空的 REFRESH_GROUP 代表全抓，所以 --group 要整個省略而不是傳空字串
        # （argparse 的 choices 會拒絕空字串）。
        group_arg=""
        if [ -n "$${REFRESH_GROUP}" ]; then group_arg="--group $${REFRESH_GROUP}"; fi
        python scripts/fetch_sources.py --out /data/records \
          --max-shrink "$${FETCH_MAX_SHRINK}" $${group_arg}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # 具名 volume 而不是 bind mount：資料的生命週期跟著服務而不是跟著 checkout 目錄，
  # `git pull` 或重新 clone 都不會影響已經抓好的資料。
  living-circle-data:

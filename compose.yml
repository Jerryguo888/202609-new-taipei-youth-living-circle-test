# Deployment unit for the New Taipei youth living circle site.
#
# The app is a fully static SPA, so there is a single service. backend/ is still
# an empty placeholder; add a second service here once it exists.
#
# Local:  cp .env.example .env && docker compose up -d --build
# Server: driven by .github/workflows/deploy.yml on the self-hosted runner.
name: nt-youth-living-circle

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the environment (or .env); empty means the CARTO basemap
        # falls back to the free, watermarked tier.
        VITE_CARTO_KEY: ${VITE_CARTO_KEY:-}
    # IMAGE_TAG is set to the commit SHA by CI so each deploy is identifiable
    # and rollback is just re-running with an older tag.
    image: ${IMAGE_NAME:-nt-youth-living-circle}:${IMAGE_TAG:-local}
    container_name: nt-youth-living-circle-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        # Without this, json-file logs grow unbounded and eventually fill the
        # server's disk.
        max-size: "10m"
        max-file: "3"
    depends_on:
      # nginx proxies /api/ to the chat service. Only ordering is guaranteed
      # here, not readiness — nginx resolves the upstream lazily per request,
      # so a slow-starting backend just yields a 502 on early calls instead of
      # preventing the static site from coming up.
      - chat

  # AI 助理後端：Bedrock + S3 知識庫。沒有 published port，只能透過 web
  # 容器的 /api/ 反向代理進來，所以不會多開一個對外的攻擊面。
  chat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-nt-youth-living-circle}-chat:${IMAGE_TAG:-local}
    container_name: nt-youth-living-circle-chat
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # 憑證走 EC2 IAM Role，boto3 自己透過 IMDS 取得。這裡不要放 access key。
      AWS_REGION: ${AWS_REGION:-us-west-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      MAX_TOKENS: ${MAX_TOKENS:-2048}
      # 留空就只用模型回答，不接知識庫。
      KNOWLEDGE_BASE_ID: ${KNOWLEDGE_BASE_ID:-}
      KB_NUM_RESULTS: ${KB_NUM_RESULTS:-5}
      KB_SEARCH_MODE: ${KB_SEARCH_MODE:-managed}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
